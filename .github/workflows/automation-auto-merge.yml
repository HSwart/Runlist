name: Automation auto-merge

on:
  workflow_run:
    workflows:
      - Test
      - Same-repo authors only
      - Security
    types: [completed]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  checks: read
  issues: write

jobs:
  auto-merge:
    name: Merge green automation pull requests
    if: >
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'pull_request_review' &&
        github.event.review.state == 'approved' &&
        startsWith(github.event.pull_request.head.ref, 'automation/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge approved automation pull request when checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REVIEW_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            BRANCH="$WORKFLOW_BRANCH"
          else
            BRANCH="$REVIEW_BRANCH"
          fi

          if ! echo "$BRANCH" | grep -q '^automation/'; then
            echo "Branch $BRANCH is not automation/*; skipping."
            exit 0
          fi

          PR_JSON=$(gh pr list --repo "$REPOSITORY" --head "$BRANCH" --state open \
            --json number,isDraft,mergeable,reviewDecision,statusCheckRollup)
          PR_NUMBER=$(echo "$PR_JSON" | jq -r '.[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            echo "No open pull request for $BRANCH."
            exit 0
          fi

          IS_DRAFT=$(echo "$PR_JSON" | jq -r '.[0].isDraft')
          if [ "$IS_DRAFT" = "true" ]; then
            gh pr ready "$PR_NUMBER" --repo "$REPOSITORY"
            echo "Marked PR #$PR_NUMBER ready; waiting for checks to rerun."
            exit 0
          fi

          REVIEW_DECISION=$(echo "$PR_JSON" | jq -r '.[0].reviewDecision // empty')
          if [ "$REVIEW_DECISION" = "CHANGES_REQUESTED" ]; then
            echo "PR #$PR_NUMBER has requested changes; skipping merge."
            exit 0
          fi

          REVIEW_CHECK=$(echo "$PR_JSON" | jq '[.[] | .statusCheckRollup[]? | select(.name == "Cursor Automation: 3. Runlist - Review automation PRs") | select(.status == "COMPLETED" and .conclusion == "SUCCESS")] | length')
          if [ "$REVIEW_DECISION" != "APPROVED" ] && [ "$REVIEW_CHECK" = "0" ]; then
            echo "PR #$PR_NUMBER is not approved and Automation 3 review check has not passed."
            exit 0
          fi

          FAILING=$(echo "$PR_JSON" | jq '[.[] | .statusCheckRollup[]? | select(.name != "Merge green automation pull requests") | select(.status != "COMPLETED" or (.conclusion != "SUCCESS" and .conclusion != "NEUTRAL" and .conclusion != "SKIPPED"))] | length')
          if [ "$FAILING" != "0" ]; then
            echo "PR #$PR_NUMBER still has incomplete or failing checks."
            exit 0
          fi

          MERGEABLE=$(echo "$PR_JSON" | jq -r '.[0].mergeable')
          if [ "$MERGEABLE" != "MERGEABLE" ]; then
            echo "PR #$PR_NUMBER is not mergeable ($MERGEABLE)."
            exit 0
          fi

          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --squash --delete-branch
          echo "Merged PR #$PR_NUMBER."

          ISSUE=$(echo "$BRANCH" | sed -n 's|^automation/\([0-9][0-9]*\)-.*|\1|p')
          if [ -n "$ISSUE" ]; then
            STATE=$(gh issue view "$ISSUE" --repo "$REPOSITORY" --json state -q .state)
            if [ "$STATE" = "OPEN" ]; then
              gh issue close "$ISSUE" --repo "$REPOSITORY" \
                --comment "Closed automatically when automation PR #${PR_NUMBER} merged."
            fi
          fi
