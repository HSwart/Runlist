name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Engineering gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run quality
      - name: Generate release SBOM
        run: node scripts/validate-sbom.js runlist-sbom.cdx.json
      - name: Upload release SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runlist-sbom
          path: runlist-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Test the extension host
        if: runner.os != 'Linux'
        run: npm run test:smoke
      - name: Test the extension host on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:smoke
  windows-compatibility:
    name: Windows compatibility
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test extension and Windows MCP registration
        shell: pwsh
        run: npm test
      - name: Test the extension host
        shell: pwsh
        run: npm run test:smoke
      - name: Build the extension package on Windows
        shell: pwsh
        run: npm run package
