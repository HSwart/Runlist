<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title description">
  <title id="title">Switchboard</title>
  <desc id="description">A control panel with a play button and three project indicators.</desc>
  <rect width="64" height="64" rx="14" fill="#161B22"/>
  <g transform="translate(8 8) scale(2)" fill="none" stroke="#F0F6FC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="18" height="18" rx="4"/>
    <line x1="10" y1="3" x2="10" y2="21"/>
    <polygon points="14,8 14,16 19,12" fill="#58A6FF" stroke="none"/>
    <circle cx="6.5" cy="7.5" r="1" fill="#F0F6FC" stroke="none"/>
    <circle cx="6.5" cy="12" r="1" fill="#F0F6FC" stroke="none"/>
    <circle cx="6.5" cy="16.5" r="1" fill="#F0F6FC" stroke="none"/>
  </g>
</svg>
